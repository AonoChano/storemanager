# ===== 配置文件模板 =====
# 使用方法: 复制本文件为 application.properties (已被 .gitignore 忽略, 不会提交),
# 然后填入你本地的 MySQL 密码和 DeepSeek API Key。

spring.application.name=storemanager
# 服务端口
server.port=8080

# MySQL 连接 (本地开发默认 root/123456, 按需修改)
spring.datasource.url=jdbc:mysql://localhost:3306/store_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
## 下划线转驼峰
mybatis.configuration.map-underscore-to-camel-case=true
## 实体别名包
mybatis.type-aliases-package=com.wjy.storemanager.entity

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# ===== DeepSeek AI 客服 =====
# 在本地 application.properties 中填入你的 DeepSeek API Key (此处为占位, 不要使用)
spring.ai.deepseek.api-key=sk-xxxxxxxxxxxxxxxx
spring.ai.deepseek.chat.options.model=deepseek-chat
spring.ai.deepseek.chat.options.temperature=0.6
