<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 进销存管理系统</title>
    <!-- 字体已本地化(static/fonts/), 不依赖 Google Fonts 网络 -->
    <script>
        // 主题优先应用(防闪烁): localStorage > 跟随系统
        (function () {
            var pref = localStorage.getItem('storemanager_theme') || 'system';
            var resolved = pref === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : pref;
            document.documentElement.dataset.theme = resolved;
            document.documentElement.dataset.themePref = pref;
        })();
    </script>

    <style>
        /* ===== 主题变量: 亮(默认) / 暗(黑白银系) ===== */
        :root {
            --paper-bg: #f4efd8;
            --paper-light: #fbf9ec;
            --ink-dark: #2c2824;
            --ink-deep-espresso: #2c1e14;
            --ink-light: #5c5549;
            --stamp-red: #8b3a3a;
            --accent-gold: #b87324;
            --border-amber: rgba(139, 126, 102, 0.3);
            --shadow-color: rgba(44, 40, 36, 0.15);
            --texture-vignette: rgba(139, 126, 102, 0.08);
            --texture-lines: rgba(0, 0, 0, 0.015);
            --ambient: rgba(255, 255, 255, 0.45);
            --card-inset: rgba(255, 255, 255, 0.6);
            --input-line: rgba(44, 40, 36, 0.3);
            --placeholder: rgba(92, 85, 73, 0.4);
            --btn-hover: #1a1714;
        }

        [data-theme="dark"] {
            --paper-bg: #0d0d0f;
            --paper-light: #212126;
            --ink-dark: #e9e7e2;
            --ink-deep-espresso: #f0ede6;
            --ink-light: #9a978f;
            --stamp-red: #c05f5f;
            --accent-gold: #c9a05e;
            --border-amber: rgba(233, 231, 226, 0.22);
            --shadow-color: rgba(0, 0, 0, 0.55);
            --texture-vignette: rgba(255, 255, 255, 0.03);
            --texture-lines: rgba(255, 255, 255, 0.018);
            --ambient: rgba(255, 255, 255, 0.06);
            --card-inset: rgba(255, 255, 255, 0.05);
            --input-line: rgba(233, 231, 226, 0.28);
            --placeholder: rgba(154, 151, 143, 0.5);
            --btn-hover: #d8d5cc;
        }
        @font-face { font-family: 'Architects Daughter'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/architects-daughter-400.woff2) format('woff2'); }
        @font-face { font-family: 'Cabin Sketch'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/cabin-sketch-700.woff2) format('woff2'); }
        @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/playfair-display-400.woff2) format('woff2'); }
        @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/playfair-display-600.woff2) format('woff2'); }
        @font-face { font-family: 'Playfair Display'; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/playfair-display-400i.woff2) format('woff2'); }
        @font-face { font-family: 'Space Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/space-mono-400.woff2) format('woff2'); }
        @font-face { font-family: 'Space Mono'; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/space-mono-400i.woff2) format('woff2'); }

        :root {
            --paper-bg: #f4efd8;
            --paper-light: #fbf9ec;
            --ink-dark: #2c2824;
            --ink-deep-espresso: #2c1e14;
            --ink-light: #5c5549;
            --stamp-red: #8b3a3a;
            --accent-gold: #b87324;
            --border-amber: rgba(139, 126, 102, 0.3);
            --shadow-color: rgba(44, 40, 36, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: var(--paper-bg);
            /* 纸张纹理与微弱渐变(主题变量驱动) */
            background-image:
                radial-gradient(circle at 50% 50%, transparent 20%, var(--texture-vignette) 100%),
                repeating-linear-gradient(45deg, transparent, transparent 2px, var(--texture-lines) 2px, var(--texture-lines) 4px);
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            color: var(--ink-dark);
            /* 小字号衬线体更清晰 */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #desktop-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: clamp(16px, 2.5vw, 40px);
            padding-right: clamp(28px, 4.5vw, 80px);
            /* 左半画布区使用自定义光标(由 JS 挂载); 右半档案卡恢复系统光标 */
            cursor: none;
        }

        /* 左半方形画布区: 宽 = 高, 不超出视口 */
        .login-left {
            position: relative;
            width: min(86dvh, 100%);
            aspect-ratio: 1;
            justify-self: center;
            overflow: hidden;
        }

        /* 动画与交互画布: 左半区系统光标隐形(自定义光标接管) */
        #vintage-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: none;
        }

        /* Ambient Lighting Gradient Overlay */
        .ambient-lighting {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, var(--ambient) 0%, transparent 65%);
            z-index: 2;
            pointer-events: none;
            transition: background 0.3s ease;
        }

        /* 右侧登录栏：伪装成档案登记卡(加宽, 右侧留白) */
        .archive-card {
            position: relative;
            z-index: 10;
            width: min(440px, 34vw);
            height: 100vh;
            background-color: var(--paper-light);
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: -15px 0 40px var(--shadow-color),
                        -1px 0 0 var(--card-inset) inset;
            border-left: 1px solid var(--border-amber);
            cursor: auto;
            transition: background-color 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card-header {
            margin-bottom: 3rem;
            position: relative;
        }

        .card-header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .card-header p {
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-light);
        }

        .form-group {
            margin-bottom: 2rem;
            position: relative;
        }

        .form-group label {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            color: var(--ink-light);
            margin-bottom: 0.3rem;
            letter-spacing: 0.05em;
        }

        .form-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--input-line);
            padding: 0.5rem 0;
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            color: var(--ink-dark);
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-bottom-color: var(--ink-dark);
        }

        .form-group input::placeholder {
            font-style: italic;
            color: var(--placeholder);
            font-size: 0.95rem;
        }

        .login-error {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--stamp-red);
            margin-bottom: 1rem;
        }

        .submit-btn {
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--ink-dark);
            color: var(--paper-light);
            border: none;
            font-family: 'Space Mono', monospace;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .submit-btn:hover {
            background: var(--btn-hover);
            transform: translateY(1px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .card-footer {
            margin-top: auto;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--ink-light);
            text-align: center;
            opacity: 0.75;
            line-height: 1.5;
        }

        .hint-text {
            position: absolute;
            bottom: 20px;
            left: 28px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--ink-light);
            pointer-events: none;
            opacity: 0.6;
            z-index: 10;
        }

        /* 主题切换(左上角: 太阳/月亮/跟随系统) */
        .theme-switch {
            position: absolute;
            top: 24px;
            left: 28px;
            z-index: 20;
            display: flex;
            gap: 8px;
            background: rgba(251, 249, 236, 0.85);
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--border-amber);
            box-shadow: 0 4px 14px var(--shadow-color);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        [data-theme="dark"] .theme-switch {
            background: rgba(33, 33, 38, 0.85);
        }

        .theme-switch button {
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 4px;
            background: transparent;
            color: var(--ink-light);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s;
        }

        .theme-switch button svg { display: block; }

        .theme-switch button:hover {
            color: var(--ink-dark);
            border-color: var(--border-amber);
        }

        .theme-switch button.active {
            color: var(--ink-dark);
            background: var(--ink-dark);
            border-color: var(--ink-dark);
        }

        .theme-switch button.active svg { stroke: var(--paper-light); }

        .btn-sound {
            pointer-events: auto;
            background: transparent;
            border: 1px dashed var(--ink-light);
            color: var(--ink-dark);
            width: 26px;
            height: 26px;
            padding: 0;
            border-radius: 3px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s;
        }

        .btn-sound svg { display: block; }

        .btn-sound .icon-off { display: none; }
        .btn-sound.active .icon-on { display: none; }
        .btn-sound.active .icon-off { display: block; }

        .btn-sound:hover {
            border-color: var(--ink-dark);
        }

        .btn-sound.active {
            border-style: solid;
            border-color: var(--ink-dark);
        }

        /* 自定义光标(占位: cursor/cursor.png, 加载后自动等比压缩) */
        #customCursor {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999;
            pointer-events: none;
            display: none;
            background: no-repeat center / contain;
        }

        #customCursor.ready { display: block; }
        #customCursor.hidden { display: none; }

        @media (max-width: 900px) {
            #desktop-container {
                display: block;
                padding: 0;
            }
            .login-left {
                display: none;
            }
            .archive-card {
                width: 100%;
                height: 100vh;
                box-shadow: none;
                background-color: var(--paper-light);
            }
        }
    </style>
</head>
<body>

<div id="desktop-container">
    <div class="ambient-lighting"></div>

    <!-- 主题切换: 亮色 / 暗色 / 跟随系统 -->
    <div class="theme-switch" id="themeSwitch" role="group" aria-label="主题切换">
        <button data-theme="light" title="亮色主题" aria-label="亮色主题">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
                <circle cx="8" cy="8" r="3.2"/>
                <path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"/>
            </svg>
        </button>
        <button data-theme="dark" title="暗色主题" aria-label="暗色主题">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13.2 9.6A5.8 5.8 0 0 1 6.4 2.8 5.8 5.8 0 1 0 13.2 9.6z"/>
            </svg>
        </button>
        <button data-theme="system" title="跟随系统" aria-label="跟随系统">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1.5" y="2.5" width="13" height="9" rx="1"/>
                <path d="M5.5 14.5h5M8 11.5v3"/>
            </svg>
        </button>
    </div>

    <div class="hint-text">
        <button class="btn-sound active" id="soundBtn" type="button" title="音效: 开" aria-label="音效开关">
            <svg class="icon-on" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 6v4h2.5L8 13V3L4.5 6H2z"/>
                <path d="M10.5 5.5a3.5 3.5 0 0 1 0 5"/>
                <path d="M12.5 3.5a6.5 6.5 0 0 1 0 9"/>
            </svg>
            <svg class="icon-off" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 6v4h2.5L8 13V3L4.5 6H2z"/>
                <path d="M10.5 5.5l3 5M13.5 5.5l-3 5"/>
            </svg>
        </button>
        <span>✎ 在左侧手绘文字上移动鼠标触发物理挤压与墨水抖动效果</span>
    </div>

    <!-- 兼具背景测绘图与手绘弹力字体的画布 -->
    <!-- 左半方形画布区 -->
    <div class="login-left">
        <canvas id="vintage-canvas"></canvas>
    </div>

    <!-- 右侧档案卡 (StoreManager 登录) -->
    <div class="archive-card">
        <div class="card-header">
            <h1>登录</h1>
            <p>StoreManager 进销存管理系统</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="username" placeholder="请输入账号" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>

            <div class="login-error" id="loginError" hidden></div>

            <button type="submit" class="submit-btn" id="submitBtn">登 录</button>
        </form>

        <div class="card-footer">
            <p>进销存管理系统 · 采购 / 销售 / 库存 / 报表</p>
            <p>默认账号 admin / 123456</p>
        </div>
    </div>
</div>

<!-- 自定义光标(图片放 static/cursor/cursor.png, 加载后自动等比压缩到 32px) -->
<div id="customCursor"></div>

<script>
    const canvas = document.getElementById('vintage-canvas');
    const ctx = canvas.getContext('2d');

    // 字号固定为最大, 弹性固定为最小(原概念稿的控制栏已移除)
    const FONT_SIZE = 140;
    const ELASTICITY = 1;

    let dpr = window.devicePixelRatio || 1;
    let width, height;
    let mouse = { x: -9999, y: -9999, px: -9999, py: -9999, speed: 0 };
    let letters = [];
    let nodes = [];
    let edges = [];
    let time = 0;
    let frame = 0;
    // 音效默认开启
    let soundEnabled = true;

    // Web Audio API 模拟铅笔滑动音效
    let audioCtx = null;
    function playScratchSound() {
        if (!soundEnabled) return;
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const bufferSize = audioCtx.sampleRate * 0.025;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1100 + Math.random() * 600;
        filter.Q.value = 2.5;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.025);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
    }

    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.classList.toggle('active', soundEnabled);
        soundBtn.title = soundEnabled ? '音效: 开' : '音效: 关';
    });

    // 两套画布配色: 亮(羊皮纸档案) / 暗(黑白银系, 手写体白色)
    const THEMES = {
        light: {
            clear: '#f4efd8',
            grid: 'rgba(139, 126, 102, 0.08)',
            ink: 'rgba(44, 40, 36, 0.8)',
            inkLight: 'rgba(92, 85, 73, 0.25)',
            highlight: 'rgba(139, 58, 58, 0.65)',
            edgeRgb: '92, 85, 73',
            letterDraft: 'rgba(90, 52, 26, 0.45)',
            letterFill: '#2c1e14',
            letterStroke: '#5a341a',
            haloRgb: '184, 115, 36'
        },
        dark: {
            clear: '#0d0d0f',
            grid: 'rgba(255, 255, 255, 0.05)',
            ink: 'rgba(233, 231, 226, 0.8)',
            inkLight: 'rgba(154, 151, 143, 0.3)',
            highlight: 'rgba(192, 95, 95, 0.65)',
            edgeRgb: '154, 151, 143',
            letterDraft: 'rgba(233, 231, 226, 0.38)',
            letterFill: '#f0ede6',
            letterStroke: '#b9b5ac',
            haloRgb: '201, 160, 94'
        }
    };
    let colors = THEMES[document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light'];

    // 单个字符类 (Machinarium 手绘草稿风格 + 弹簧阻尼)
    class Letter {
        constructor(char, x, y, fontSize) {
            this.char = char;
            this.baseX = x;
            this.baseY = y;
            this.x = x;
            this.y = y;

            this.vx = 0;
            this.vy = 0;

            this.scaleX = 1;
            this.scaleY = 1;
            this.vScaleX = 0;
            this.vScaleY = 0;

            this.rotation = 0;
            this.vRotation = 0;

            this.fontSize = fontSize;
            this.hoverAmount = 0;
            this.seed = Math.random() * 1000;
        }

        update(elasticityFactor) {
            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            // 判定半径: 略大于系统光标(40px), 贴近字母即可触发, 推开感明显
            const maxDist = 40;

            if (dist < maxDist) {
                const force = (1 - dist / maxDist);
                const angle = Math.atan2(dy, dx);

                // 推开力
                const push = force * 15 * elasticityFactor;
                this.vx -= Math.cos(angle) * push;
                this.vy -= Math.sin(angle) * push;

                // 挤压变形
                this.vScaleX += force * 0.07 * (Math.random() > 0.5 ? 1 : -1);
                this.vScaleY += force * 0.07 * (Math.random() > 0.5 ? 1 : -1);

                // 扭转力
                this.vRotation += (Math.random() - 0.5) * force * 0.11;

                this.hoverAmount = Math.min(1, this.hoverAmount + 0.15);

                if (mouse.speed > 2 && Math.random() < 0.3) {
                    playScratchSound();
                }
            } else {
                this.hoverAmount = Math.max(0, this.hoverAmount - 0.05);
            }

            // 弹簧阻尼模型
            const stiffness = 0.08;
            const damping = 0.75;

            // 位置复位
            const fx = (this.baseX - this.x) * stiffness;
            const fy = (this.baseY - this.y) * stiffness;
            this.vx = (this.vx + fx) * damping;
            this.vy = (this.vy + fy) * damping;
            this.x += this.vx;
            this.y += this.vy;

            // 缩放复位
            const fsx = (1 - this.scaleX) * stiffness;
            const fsy = (1 - this.scaleY) * stiffness;
            this.vScaleX = (this.vScaleX + fsx) * damping;
            this.vScaleY = (this.vScaleY + fsy) * damping;
            this.scaleX += this.vScaleX;
            this.scaleY += this.vScaleY;

            // 旋转复位
            const fr = (0 - this.rotation) * stiffness;
            this.vRotation = (this.vRotation + fr) * damping;
            this.rotation += this.vRotation;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.scale(this.scaleX, this.scaleY);

            ctx.font = `700 ${this.fontSize}px 'Cabin Sketch', 'Architects Daughter', cursive`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 静止时文字保持稳定: 抖动偏移固定, 仅在悬停时随 hoverAmount 增强
            const seed = this.seed;
            const jitter = this.hoverAmount;
            const noise = (s) => (Math.sin(s * 9999) * 10000) % 1;

            // 1. 悬停时的琥珀金草稿光晕 (Hover draft halo)
            if (jitter > 0.1) {
                ctx.strokeStyle = `rgba(${colors.haloRgb}, ${0.4 * jitter})`;
                ctx.lineWidth = 2;
                for (let i = 0; i < 2; i++) {
                    const ox = (noise(seed + i * 10) - 0.5) * 8 * jitter;
                    const oy = (noise(seed + i * 20) - 0.5) * 8 * jitter;
                    ctx.strokeText(this.char, ox, oy);
                }
            }

            // 2. 底层浓墨抖动描边 (Draft Stroke)
            ctx.strokeStyle = colors.letterDraft;
            ctx.lineWidth = 3.5;
            const ox1 = (noise(seed + 1) - 0.5) * 2.5 * (0.35 + jitter * 0.65);
            const oy1 = (noise(seed + 2) - 0.5) * 2.5 * (0.35 + jitter * 0.65);
            ctx.strokeText(this.char, ox1, oy1);

            // 3. 顶层主字体: 深色主题下为白色手写体
            ctx.fillStyle = colors.letterFill;
            ctx.strokeStyle = colors.letterStroke;
            ctx.lineWidth = 1.8;

            const ox2 = (noise(seed + 3) - 0.5) * 1.5 * (0.35 + jitter * 0.65);
            const oy2 = (noise(seed + 4) - 0.5) * 1.5 * (0.35 + jitter * 0.65);

            ctx.fillText(this.char, ox2, oy2);
            ctx.strokeText(this.char, ox2, oy2);

            ctx.restore();
        }
    }

    // 背景古典测绘节点与连线
    class Node {
        constructor(x, y, isPrimary) {
            this.baseX = x;
            this.baseY = y;
            this.phase = Math.random() * Math.PI * 2;
            this.radius = isPrimary ? 3.5 : 2;
            this.isPrimary = isPrimary;
        }

        update(t) {
            this.x = this.baseX + Math.sin(this.phase + t * 0.5) * 12;
            this.y = this.baseY + Math.cos(this.phase + t * 0.4) * 12;
        }

        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.isPrimary ? colors.highlight : colors.ink;
            ctx.fill();

            if (this.isPrimary) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 2.8, 0, Math.PI * 2);
                ctx.strokeStyle = colors.inkLight;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }
    }

    class Edge {
        constructor(nodeA, nodeB) {
            this.a = nodeA;
            this.b = nodeB;
            this.cpOffset = (Math.random() - 0.5) * 80;
            this.drawProgress = Math.random();
        }

        draw(ctx) {
            const dx = this.b.x - this.a.x;
            const dy = this.b.y - this.a.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 350) return;

            const midX = (this.a.x + this.b.x) / 2;
            const midY = (this.a.y + this.b.y) / 2;
            const angle = Math.atan2(dy, dx);
            const cpX = midX + Math.cos(angle + Math.PI / 2) * this.cpOffset;
            const cpY = midY + Math.sin(angle + Math.PI / 2) * this.cpOffset;

            this.drawProgress -= 0.0015;

            ctx.beginPath();
            ctx.moveTo(this.a.x, this.a.y);
            ctx.quadraticCurveTo(cpX, cpY, this.b.x, this.b.y);

            ctx.setLineDash([3, 5]);
            ctx.lineDashOffset = this.drawProgress * 80;

            const alpha = Math.max(0, 1 - (this.a.x / (width || 1000)) * 1.3);
            ctx.strokeStyle = `rgba(${colors.edgeRgb}, ${0.35 * alpha})`;
            ctx.lineWidth = 0.7;

            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    // 初始化测绘图与节点(坐标基于方形画布区, CSS 像素)
    function initGraph() {
        nodes = [];
        edges = [];

        const nodeCount = Math.floor((width * height) / 28000);
        for (let i = 0; i < nodeCount; i++) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const isPrimary = Math.random() > 0.85;
            nodes.push(new Node(x, y, isPrimary));
        }

        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                const dx = nodes[i].baseX - nodes[j].baseX;
                const dy = nodes[i].baseY - nodes[j].baseY;
                if (dx * dx + dy * dy < 35000) {
                    if (Math.random() > 0.45) {
                        edges.push(new Edge(nodes[i], nodes[j]));
                    }
                }
            }
        }
    }

    // 布局两行手绘交互文字(基于方形画布区居中)
    function layoutLetters() {
        letters = [];
        const line1 = "STORE";
        const line2 = "MANAGER";
        const fontSize = FONT_SIZE;

        ctx.font = `700 ${fontSize}px 'Cabin Sketch', 'Architects Daughter', cursive`;

        const isMobile = window.innerWidth <= 900;
        const leftAreaWidth = isMobile ? window.innerWidth : width;
        const centerX = leftAreaWidth / 2;
        const centerY = height / 2;
        const lineHeight = fontSize * 1.15;

        const lines = [line1, line2];
        const totalHeight = lineHeight * (lines.length - 1);
        const startY = centerY - totalHeight / 2;

        lines.forEach((text, lineIdx) => {
            let totalWidth = 0;
            const letterWidths = [];

            for (let i = 0; i < text.length; i++) {
                const w = ctx.measureText(text[i]).width;
                letterWidths.push(w);
                totalWidth += w;
            }

            let currentX = centerX - totalWidth / 2;
            const currentY = startY + lineIdx * lineHeight;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const w = letterWidths[i];
                const x = currentX + w / 2;

                letters.push(new Letter(char, x, currentY, fontSize));
                currentX += w;
            }
        });
    }

    // 绘制古典比例尺网格
    function drawGrid(ctx) {
        ctx.strokeStyle = colors.grid;
        ctx.lineWidth = 1;
        const gridSize = 100;

        ctx.beginPath();
        for (let x = 0; x < width; x += gridSize) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
        }
        for (let y = 0; y < height; y += gridSize) {
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
        }
        ctx.stroke();

        ctx.strokeStyle = colors.inkLight;
        ctx.lineWidth = 0.5;
        const marks = [
            { x: 40, y: 40 },
            { x: 40, y: height - 40 },
            { x: width - 40, y: 40 },
            { x: width - 40, y: height - 40 }
        ];

        marks.forEach(m => {
            ctx.beginPath();
            ctx.moveTo(m.x - 8, m.y); ctx.lineTo(m.x + 8, m.y);
            ctx.moveTo(m.x, m.y - 8); ctx.lineTo(m.x, m.y + 8);
            ctx.stroke();

            ctx.fillStyle = colors.inkLight;
            ctx.font = '9px "Space Mono", monospace';
            ctx.fillText(`+${m.x.toFixed(0)}`, m.x + 10, m.y + 3);
        });
    }

    function resize() {
        dpr = window.devicePixelRatio || 1;
        // canvas 尺寸跟随方形容器, 高分屏按 dpr 缩放保持清晰
        const rect = canvas.parentElement.getBoundingClientRect();
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        initGraph();
        layoutLetters();
    }

    // 渲染循环
    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        frame++;

        // 鼠标移动速度计算
        const mdx = mouse.x - mouse.px;
        const mdy = mouse.y - mouse.py;
        mouse.speed = Math.sqrt(mdx * mdx + mdy * mdy);
        mouse.px = mouse.x;
        mouse.py = mouse.y;

        // 不透明清屏: 消除半透明拖尾残影, 视觉干净且减少混合开销
        ctx.fillStyle = colors.clear;
        ctx.fillRect(0, 0, width, height);

        // 1. 绘制网格与底纹测绘节点
        drawGrid(ctx);
        edges.forEach(edge => edge.draw(ctx));
        nodes.forEach(node => {
            node.update(time);
            node.draw(ctx);
        });

        // 2. 绘制手绘物理弹力文字
        for (let letter of letters) {
            letter.update(ELASTICITY);
            letter.draw();
        }
    }

    // ========== 自定义光标(占位 cursor/cursor.png, 加载后自动等比压缩到 32px) ==========
    // 你设计好 PNG 后直接替换 src/main/resources/static/cursor/cursor.png 即可, 无需改代码
    const CURSOR_PATH = 'cursor/cursor.png';
    const CURSOR_SIZE = 32;
    const cursorEl = document.getElementById('customCursor');
    let cursorReady = false;

    (function loadCustomCursor() {
        const img = new Image();
        img.onload = () => {
            // 自动压缩: 长边压到 32px, 保持宽高比(任意分辨率原图都能用)
            const scale = CURSOR_SIZE / Math.max(img.width, img.height);
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            cursorEl.style.width = w + 'px';
            cursorEl.style.height = h + 'px';
            cursorEl.style.backgroundImage = `url(${c.toDataURL('image/png')})`;
            cursorEl.classList.add('ready');
            cursorReady = true;
            // 触摸设备不启用自定义光标
            if (window.matchMedia('(hover: none)').matches) {
                cursorEl.classList.add('hidden');
            }
        };
        img.onerror = () => { /* 图片缺失: 静默退回系统光标 */ };
        img.src = CURSOR_PATH;
    })();

    // 光标跟随: 仅在左半画布区显示, 右半档案卡(表单)用系统光标
    function updateCursor(x, y) {
        if (!cursorReady) return;
        const card = document.querySelector('.archive-card').getBoundingClientRect();
        const overCard = x >= card.left;
        cursorEl.classList.toggle('hidden', overCard);
        if (!overCard) {
            cursorEl.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%)`;
        }
    }

    // 事件监听
    window.addEventListener('resize', resize);

    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        updateCursor(e.clientX, e.clientY);
    });

    window.addEventListener('mouseleave', () => {
        mouse.x = -9999;
        mouse.y = -9999;
        if (cursorReady) cursorEl.classList.add('hidden');
    });

    // Touch Support
    window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }
        if (cursorReady) cursorEl.classList.add('hidden');
    }, { passive: true });

    window.addEventListener('touchend', () => {
        mouse.x = -9999;
        mouse.y = -9999;
    });

    // ========== 主题切换: 亮 / 暗 / 跟随系统 ==========
    const themeBtns = document.querySelectorAll('#themeSwitch button');

    function syncThemeButtons() {
        const pref = document.documentElement.dataset.themePref || 'system';
        themeBtns.forEach(b => b.classList.toggle('active', b.dataset.theme === pref));
    }

    function applyTheme() {
        const pref = document.documentElement.dataset.themePref || 'system';
        const resolved = pref === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : pref;
        document.documentElement.dataset.theme = resolved;
        colors = THEMES[resolved];
        syncThemeButtons();
        // 立即重绘一帧, 画布换色无需等下一帧动画
        ctx.fillStyle = colors.clear;
        ctx.fillRect(0, 0, width, height);
    }

    themeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            document.documentElement.dataset.themePref = btn.dataset.theme;
            localStorage.setItem('storemanager_theme', btn.dataset.theme);
            applyTheme();
        });
    });

    // 跟随系统模式下, 系统主题变化时实时切换
    const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    themeMedia.addEventListener('change', () => {
        if (document.documentElement.dataset.themePref === 'system') applyTheme();
    });
    syncThemeButtons();

    // ========== 登录接入 ==========
    const loginForm = document.getElementById('loginForm');
    const errEl = document.getElementById('loginError');
    const submitBtn = document.getElementById('submitBtn');

    function showError(msg) {
        errEl.hidden = false;
        errEl.textContent = msg;
    }

    // 把后端/网络原始错误翻译成友好的短提示
    function friendlyLoginError(m) {
        const t = String(m || '').replace(/^系统异常[:：]?\s*/, '').split(/\r?\n/)[0].trim();
        if (t === '用户名不存在!' || t === '密码错误') return '账号或密码错误';
        if (/数据库|querying database|###/.test(t)) return '服务暂时不可用，请稍后再试';
        return t || '登录失败，请稍后再试';
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) { showError('请输入账号和密码'); return; }
        errEl.hidden = true;
        submitBtn.disabled = true;
        submitBtn.textContent = '登 录中…';
        try {
            const r = await fetch('/user/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const j = await r.json();
            if (j.code !== 1) throw new Error(j.msg);
            localStorage.setItem('storemanager_token', j.data.token);
            localStorage.setItem('storemanager_user', JSON.stringify(j.data.user));
            location.href = '/';
        } catch (err) {
            showError(friendlyLoginError(err.message));
            submitBtn.disabled = false;
            submitBtn.textContent = '登 录';
        }
    });

    // 确保字体加载完毕后平滑启动
    document.fonts.ready.then(() => {
        resize();
        animate();
    });
</script>
</body>
</html>
