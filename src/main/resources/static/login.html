<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 进销存管理系统</title>
    <!-- 字体已本地化(static/fonts/), 不依赖 Google Fonts 网络 -->
    <!-- 共享主题 token(与主系统 index.html 共用) -->
    <link rel="stylesheet" href="theme.css">
    <script>
        // 主题优先应用(防闪烁): localStorage > 跟随系统
        (function () {
            var pref = localStorage.getItem('storemanager_theme') || 'system';
            var resolved = pref === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : pref;
            document.documentElement.dataset.theme = resolved;
            document.documentElement.dataset.themePref = pref;
        })();
    </script>

    <style>
        /* ===== 登录页布局变量(集中管理: 改这里, CSS/JS 同时生效) ===== */
        :root {
            --login-square-max: 100dvh;   /* 左侧方形最大边长 = 视口高 */
            --login-square-min: 62vw;     /* 窄屏收缩下限 */
            --login-form-w: 400px;        /* 右侧表单内容最大宽度 */
            --login-form-pad: clamp(28px, 4vw, 64px);  /* 右侧面板内边距 */
        }

        /* ===== 登录页私有 token: 暗黑工业风(覆盖 theme.css 同名变量, 不影响主系统) ===== */
        :root {
            --texture-vignette: rgba(139, 126, 102, 0.08);
            --texture-lines: rgba(0, 0, 0, 0.015);
            --ambient: rgba(255, 255, 255, 0.45);
            --card-inset: rgba(255, 255, 255, 0.6);
            --input-line: rgba(44, 40, 36, 0.3);
            --placeholder: rgba(92, 85, 73, 0.4);
            /* 工业红点缀(亮色: 深红, 暗色: 亮红) */
            --login-accent: #A63B2A;
            --login-accent-bright: #C0392B;
            /* 做旧羊皮纸登录按钮 */
            --login-btn-bg: #F5F5DC;
            --login-btn-text: #2C2824;
            --login-btn-border: #8B3A3A;
            --social-bg: rgba(44, 40, 36, 0.05);
            --frame-border: rgba(44, 40, 36, 0.12);
            --footer-bg: rgba(251, 249, 236, 0.92);
        }

        /* 暗色主题: 深灰黑工业底, 面板略浅一档以区分(不融合) */
        [data-theme="dark"] {
            --bg: #16181D;
            --surface: #1B1E24;
            --texture-vignette: rgba(255, 255, 255, 0.03);
            --texture-lines: rgba(255, 255, 255, 0.018);
            --ambient: rgba(255, 255, 255, 0.06);
            --card-inset: rgba(255, 255, 255, 0.05);
            --input-line: rgba(233, 231, 226, 0.25);
            --placeholder: rgba(154, 151, 143, 0.5);
            --login-accent: #E05A4E;
            --login-accent-bright: #F07167;
            --login-btn-bg: #F5F5DC;
            --login-btn-text: #2C2824;
            --login-btn-border: #8B3A3A;
            --social-bg: rgba(255, 255, 255, 0.06);
            --frame-border: rgba(255, 255, 255, 0.08);
            --footer-bg: rgba(27, 30, 36, 0.92);
        }
        @font-face { font-family: 'Architects Daughter'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/architects-daughter-400.woff2) format('woff2'); }
        @font-face { font-family: 'Cabin Sketch'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/cabin-sketch-700.woff2) format('woff2'); }
        @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/playfair-display-400.woff2) format('woff2'); }
        @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/playfair-display-600.woff2) format('woff2'); }
        @font-face { font-family: 'Playfair Display'; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/playfair-display-400i.woff2) format('woff2'); }
        @font-face { font-family: 'Space Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/space-mono-400.woff2) format('woff2'); }
        @font-face { font-family: 'Space Mono'; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/space-mono-400i.woff2) format('woff2'); }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg);
            /* 纸张纹理与微弱渐变(主题变量驱动) */
            background-image:
                radial-gradient(circle at 50% 50%, transparent 20%, var(--texture-vignette) 100%),
                repeating-linear-gradient(45deg, transparent, transparent 2px, var(--texture-lines) 2px, var(--texture-lines) 4px);
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-size: 16px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #desktop-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: stretch;
            /* 左半画布区使用自定义光标(由 JS 挂载); 右半登录面板恢复系统光标 */
            cursor: none;
        }

        /* 动画与交互画布: 左半区系统光标隐形(自定义光标接管) */
        #vintage-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: none;
        }

        /* Ambient Lighting Gradient Overlay */
        .ambient-lighting {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, var(--ambient) 0%, transparent 65%);
            z-index: 2;
            pointer-events: none;
            transition: background 0.3s ease;
        }

        /* 极细外边框(工业蓝图框, 纯装饰) */
        .page-frame {
            position: fixed;
            inset: 10px;
            border: 1px solid var(--frame-border);
            pointer-events: none;
            z-index: 4;
        }

        /* 左半方形区域: 占位载体, 边长 = 视口高(窄屏收缩), 与 canvas 布局一致 */
        .login-square {
            width: min(var(--login-square-max), var(--login-square-min));
            aspect-ratio: 1;
        }

        /* 右侧登录面板: 弹性占满 视口宽-左方形, 表单内容居中限宽 */
        .archive-card {
            position: relative;
            z-index: 10;
            width: auto;
            min-width: 0;
            background-color: var(--surface);
            padding: 4rem var(--login-form-pad);
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: -15px 0 40px var(--shadow),
                        -1px 0 0 var(--card-inset) inset;
            border-left: 1px solid var(--border);
            cursor: auto;
            transition: background-color 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        /* 表单内容: 居中, 最大宽度由 --login-form-w 控制(宽屏不散, 窄屏自适应) */
        .archive-card > * {
            width: 100%;
            max-width: var(--login-form-w);
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== 顶部标题区 ===== */
        .card-header {
            margin-bottom: 3.2rem;
            position: relative;
        }

        .card-header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            margin-bottom: 0.9rem;
        }

        .card-header p {
            font-family: 'Space Mono', monospace;
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            color: var(--dim);
        }

        /* ===== 表单输入区: 序号标签 + 线框图标 + 下划线红菱形 ===== */
        .form-group {
            margin-bottom: 1.8rem;
            position: relative;
        }

        .form-group label {
            display: flex;
            align-items: baseline;
            gap: 0.55em;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--dim);
            margin-bottom: 0.55rem;
            letter-spacing: 0.08em;
        }

        .form-group label .field-no {
            color: var(--login-accent);
            letter-spacing: 0.1em;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--input-line);
            padding: 0.62rem 2.4rem 0.62rem 2rem;
            font-size: 1.02rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-wrap input:focus {
            border-bottom-color: var(--login-accent);
        }

        .input-wrap input::placeholder {
            color: var(--placeholder);
            font-size: 0.92rem;
        }

        /* 左侧线框图标 */
        .input-icon {
            position: absolute;
            left: 0.15rem;
            top: 50%;
            transform: translateY(-50%);
            width: 17px;
            height: 17px;
            color: var(--dim);
            transition: color 0.3s ease;
            pointer-events: none;
        }

        .input-wrap:focus-within .input-icon {
            color: var(--login-accent);
        }

        /* 下划线末端(右侧)的红色小菱形点缀 */
        .line-dot {
            position: absolute;
            right: 0.15rem;
            bottom: 0;
            transform: translateY(50%) rotate(45deg);
            width: 6px;
            height: 6px;
            background: var(--login-accent);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        .input-wrap:focus-within .line-dot {
            transform: translateY(50%) rotate(45deg) scale(1.3);
            box-shadow: 0 0 8px var(--login-accent);
        }

        /* 密码可见性切换(小眼睛) */
        .eye-toggle {
            position: absolute;
            right: 0.1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 5px;
            color: var(--dim);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: color 0.2s ease;
        }

        .eye-toggle:hover { color: var(--text); }
        .eye-toggle .icon-off { display: none; }
        .eye-toggle.shown .icon-on { display: none; }
        .eye-toggle.shown .icon-off { display: block; }

        .login-error {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--err);
            margin-bottom: 1rem;
        }

        /* ===== 记住我 + 忘记密码 ===== */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.2rem 0 1.6rem;
            font-size: 0.85rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--dim);
            cursor: pointer;
            user-select: none;
        }

        .remember input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .checkbox-box {
            width: 15px;
            height: 15px;
            border: 1px solid var(--border);
            display: grid;
            place-items: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .remember input:checked + .checkbox-box {
            background: var(--login-accent);
            border-color: var(--login-accent);
        }

        .checkbox-box::after {
            content: '';
            width: 7px;
            height: 4px;
            border-left: 1.5px solid #fff;
            border-bottom: 1.5px solid #fff;
            transform: rotate(-45deg) translateY(-1px);
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .remember input:checked + .checkbox-box::after { opacity: 1; }

        .remember:hover .checkbox-box { border-color: var(--login-accent); }

        .link-forgot {
            color: var(--login-accent);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .link-forgot:hover { color: var(--login-accent-bright); text-decoration: underline; }

        /* ===== 登录按钮: 做旧羊皮纸 + 暗红细描边 + 箭头 ===== */
        .submit-btn {
            width: 100%;
            margin-top: 0.4rem;
            padding: 0.98rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--login-btn-bg);
            /* 微弱做旧纹理(亮点渐变) */
            background-image: radial-gradient(ellipse at 30% 0%, rgba(255, 255, 255, 0.55), transparent 55%);
            color: var(--login-btn-text);
            border: 1px solid var(--login-btn-border);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.28em;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .submit-btn .btn-arrow {
            width: 26px;
            height: 11px;
            color: var(--login-btn-text);
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .submit-btn:hover {
            border-color: var(--login-accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
            transform: translateY(-1px);
        }

        .submit-btn:hover .btn-arrow {
            transform: translateX(3px);
            color: var(--login-accent);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        /* ===== 分隔线与社交登录 ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            /* 注意: margin 简写会覆盖 .archive-card > * 的左右 auto 居中, 必须保留 auto */
            margin: 2rem auto 1.4rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            color: var(--faint);
            white-space: nowrap;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .social-row {
            display: flex;
            justify-content: center;
            gap: 1.6rem;
        }

        .social-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--dim);
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            padding: 0;
        }

        .social-circle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--social-bg);
            border: 1px solid var(--border);
            display: grid;
            place-items: center;
            color: var(--text);
            transition: all 0.2s ease;
        }

        .social-btn:hover .social-circle {
            border-color: var(--login-accent);
            color: var(--login-accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .social-btn:hover { color: var(--text); }

        /* ===== 底部注册入口 ===== */
        .signup-row {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--dim);
        }

        .link-register {
            color: var(--login-accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .link-register:hover { color: var(--login-accent-bright); }

        /* ===== 页面底部版权区(细横线分割, 小字低透明度) ===== */
        .page-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2.2rem;
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            background: var(--footer-bg);
            backdrop-filter: blur(6px);
            font-family: 'Space Mono', monospace;
            font-size: 0.64rem;
            letter-spacing: 0.06em;
            color: var(--faint);
            text-align: center;
            line-height: 1.5;
        }

        /* 左下角音效开关(原引导文案已移除) */
        .sound-toggle {
            position: absolute;
            bottom: 64px;
            left: 28px;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        /* 主题切换(左上角单按钮, 点击轮询: 亮色 -> 暗色 -> 跟随系统) */
        .theme-toggle {
            position: absolute;
            top: 24px;
            left: 28px;
            z-index: 20;
            width: 38px;
            height: 38px;
            padding: 0;
            display: grid;
            place-items: center;
            background: rgba(251, 249, 236, 0.85);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            box-shadow: 0 4px 14px var(--shadow);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        [data-theme="dark"] .theme-toggle {
            background: rgba(33, 33, 38, 0.85);
        }

        .theme-toggle svg { display: none; }
        .theme-toggle[data-pref="light"] .icon-sun { display: block; }
        .theme-toggle[data-pref="dark"] .icon-moon { display: block; }
        .theme-toggle[data-pref="system"] .icon-monitor { display: block; }

        .theme-toggle:hover {
            border-color: var(--accent);
        }

        .btn-sound {
            pointer-events: auto;
            background: transparent;
            border: 1px dashed var(--dim);
            color: var(--text);
            width: 26px;
            height: 26px;
            padding: 0;
            border-radius: 3px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s;
        }

        .btn-sound svg { display: block; }

        .btn-sound .icon-off { display: none; }
        .btn-sound.active .icon-on { display: none; }
        .btn-sound.active .icon-off { display: block; }

        .btn-sound:hover {
            border-color: var(--text);
        }

        .btn-sound.active {
            border-style: solid;
            border-color: var(--text);
        }

        /* 开发中提示(社交登录占位) */
        #toast {
            position: fixed;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: var(--surface);
            border: 1px solid var(--login-accent);
            color: var(--text);
            padding: 0.6rem 1.5rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 8px 24px var(--shadow);
            transition: opacity 0.25s ease;
        }

        #toast.show { opacity: 1; }

        /* 自定义光标(占位: cursor/cursor.png, 加载后自动等比压缩) */
        #customCursor {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999;
            pointer-events: none;
            display: none;
            background: no-repeat center / contain;
        }

        #customCursor.ready { display: block; }
        #customCursor.hidden { display: none; }

        @media (max-width: 900px) {
            .archive-card {
                width: 100%;
                box-shadow: none;
                background-color: var(--surface);
            }
            .page-footer { gap: 1rem; flex-direction: column; padding: 0.5rem 1rem; }
            .sound-toggle { display: none; }
        }

        /* 矮窗口: 面板内容多, 改为顶部对齐可滚动, 避免挤压裁切 */
        @media (max-height: 760px) {
            .archive-card {
                justify-content: flex-start;
                padding-top: 2.5rem;
                overflow-y: auto;
            }
            .card-header { margin-bottom: 2rem; }
        }
    </style>
</head>
<body>

<div id="desktop-container">
    <div class="ambient-lighting"></div>
    <div class="page-frame" aria-hidden="true"></div>

    <!-- 主题切换: 单按钮点击轮询 亮色 -> 暗色 -> 跟随系统 -->
    <button class="theme-toggle" id="themeToggle" title="主题: 跟随系统" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
            <circle cx="8" cy="8" r="3.2"/>
            <path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.2 9.6A5.8 5.8 0 0 1 6.4 2.8 5.8 5.8 0 1 0 13.2 9.6z"/>
        </svg>
        <svg class="icon-monitor" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1.5" y="2.5" width="13" height="9" rx="1"/>
            <path d="M5.5 14.5h5M8 11.5v3"/>
        </svg>
    </button>

    <div class="sound-toggle">
        <button class="btn-sound active" id="soundBtn" type="button" title="音效: 开" aria-label="音效开关">
            <svg class="icon-on" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 6v4h2.5L8 13V3L4.5 6H2z"/>
                <path d="M10.5 5.5a3.5 3.5 0 0 1 0 5"/>
                <path d="M12.5 3.5a6.5 6.5 0 0 1 0 9"/>
            </svg>

<!-- 开发中提示 -->

<!-- 自定义光标(图片放 static/cursor/cursor.png, 加载后自动等比压缩到 32px) -->
<div id="customCursor"></div>

<script>
    const canvas = document.getElementById('vintage-canvas');
    const ctx = canvas.getContext('2d');

    // 布局: 左方形边长从 CSS 变量读取(dvh/vw/px 均可解析), 改 --login-square-* 即全局生效
    function loginSquare() {
        const cs = getComputedStyle(document.documentElement);
        const px = v => {
            const t = String(v).trim();
            if (t.endsWith('dvh')) return window.innerHeight * (parseFloat(t) / 100);
            if (t.endsWith('vw')) return window.innerWidth * (parseFloat(t) / 100);
            return parseFloat(t) || 0;
        };
        const max = px(cs.getPropertyValue('--login-square-max')) || window.innerHeight;
        const min = px(cs.getPropertyValue('--login-square-min')) || window.innerWidth * 0.62;
        return Math.max(0, Math.min(max, min));
    }

    // 字号固定为最大, 弹性固定为最小(原概念稿的控制栏已移除)
    const FONT_SIZE = 140;
    const ELASTICITY = 1;

    let dpr = window.devicePixelRatio || 1;
    let width, height;
    let mouse = { x: -9999, y: -9999, px: -9999, py: -9999, speed: 0 };
    let letters = [];
    let nodes = [];
    let edges = [];
    let time = 0;
    let frame = 0;
    // 音效默认开启
    let soundEnabled = true;

    // Web Audio API 模拟铅笔滑动音效
    let audioCtx = null;
    function playScratchSound() {
        if (!soundEnabled) return;
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const bufferSize = audioCtx.sampleRate * 0.025;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1100 + Math.random() * 600;
        filter.Q.value = 2.5;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.025);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
    }

    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.classList.toggle('active', soundEnabled);
        soundBtn.title = soundEnabled ? '音效: 开' : '音效: 关';
    });

    // 两套画布配色: 亮(羊皮纸档案) / 暗(深灰黑工业底 + 白色手写体)
    const THEMES = {
        light: {
            clear: '#f4efd8',
            grid: 'rgba(139, 126, 102, 0.08)',
            ink: 'rgba(44, 40, 36, 0.8)',
            inkLight: 'rgba(92, 85, 73, 0.25)',
            highlight: 'rgba(139, 58, 58, 0.65)',
            edgeRgb: '92, 85, 73',
            letterDraft: 'rgba(90, 52, 26, 0.45)',
            letterFill: '#2c1e14',
            letterStroke: '#5a341a',
            haloRgb: '184, 115, 36'
        },
        dark: {
            clear: '#16181D',
            grid: 'rgba(255, 255, 255, 0.05)',
            ink: 'rgba(233, 231, 226, 0.8)',
            inkLight: 'rgba(154, 151, 143, 0.3)',
            highlight: 'rgba(224, 90, 78, 0.65)',
            edgeRgb: '154, 151, 143',
            letterDraft: 'rgba(233, 231, 226, 0.38)',
            letterFill: '#f0ede6',
            letterStroke: '#b9b5ac',
            haloRgb: '224, 90, 78'
        }
    };
    let colors = THEMES[document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light'];

    // 单个字符类 (Machinarium 手绘草稿风格 + 弹簧阻尼)
    class Letter {
        constructor(char, x, y, fontSize) {
            this.char = char;
            this.baseX = x;
            this.baseY = y;
            this.x = x;
            this.y = y;

            this.vx = 0;
            this.vy = 0;

            this.scaleX = 1;
            this.scaleY = 1;
            this.vScaleX = 0;
            this.vScaleY = 0;

            this.rotation = 0;
            this.vRotation = 0;

            this.fontSize = fontSize;
            this.hoverAmount = 0;
            this.seed = Math.random() * 1000;
        }

        update(elasticityFactor) {
            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            // 判定半径: 略大于系统光标(40px), 贴近字母即可触发, 推开感明显
            const maxDist = 40;

            if (dist < maxDist) {
                const force = (1 - dist / maxDist);
                const angle = Math.atan2(dy, dx);

                // 推开力
                const push = force * 15 * elasticityFactor;
                this.vx -= Math.cos(angle) * push;
                this.vy -= Math.sin(angle) * push;

                // 挤压变形
                this.vScaleX += force * 0.07 * (Math.random() > 0.5 ? 1 : -1);
                this.vScaleY += force * 0.07 * (Math.random() > 0.5 ? 1 : -1);

                // 扭转力
                this.vRotation += (Math.random() - 0.5) * force * 0.11;

                this.hoverAmount = Math.min(1, this.hoverAmount + 0.15);

                if (mouse.speed > 2 && Math.random() < 0.3) {
                    playScratchSound();
                }
            } else {
                this.hoverAmount = Math.max(0, this.hoverAmount - 0.05);
            }

            // 弹簧阻尼模型
            const stiffness = 0.08;
            const damping = 0.75;

            // 位置复位
            const fx = (this.baseX - this.x) * stiffness;
            const fy = (this.baseY - this.y) * stiffness;
            this.vx = (this.vx + fx) * damping;
            this.vy = (this.vy + fy) * damping;
            this.x += this.vx;
            this.y += this.vy;

            // 缩放复位
            const fsx = (1 - this.scaleX) * stiffness;
            const fsy = (1 - this.scaleY) * stiffness;
            this.vScaleX = (this.vScaleX + fsx) * damping;
            this.vScaleY = (this.vScaleY + fsy) * damping;
            this.scaleX += this.vScaleX;
            this.scaleY += this.vScaleY;

            // 旋转复位
            const fr = (0 - this.rotation) * stiffness;
            this.vRotation = (this.vRotation + fr) * damping;
            this.rotation += this.vRotation;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.scale(this.scaleX, this.scaleY);

            ctx.font = `700 ${this.fontSize}px 'Cabin Sketch', 'Architects Daughter', cursive`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 静止时文字保持稳定: 抖动偏移固定, 仅在悬停时随 hoverAmount 增强
            const seed = this.seed;
            const jitter = this.hoverAmount;
            const noise = (s) => (Math.sin(s * 9999) * 10000) % 1;

            // 1. 悬停时的琥珀金草稿光晕 (Hover draft halo)
            if (jitter > 0.1) {
                ctx.strokeStyle = `rgba(${colors.haloRgb}, ${0.4 * jitter})`;
                ctx.lineWidth = 2;
                for (let i = 0; i < 2; i++) {
                    const ox = (noise(seed + i * 10) - 0.5) * 8 * jitter;
                    const oy = (noise(seed + i * 20) - 0.5) * 8 * jitter;
                    ctx.strokeText(this.char, ox, oy);
                }
            }

            // 2. 底层浓墨抖动描边 (Draft Stroke)
            ctx.strokeStyle = colors.letterDraft;
            ctx.lineWidth = 3.5;
            const ox1 = (noise(seed + 1) - 0.5) * 2.5 * (0.35 + jitter * 0.65);
            const oy1 = (noise(seed + 2) - 0.5) * 2.5 * (0.35 + jitter * 0.65);
            ctx.strokeText(this.char, ox1, oy1);

            // 3. 顶层主字体: 深色主题下为白色手写体
            ctx.fillStyle = colors.letterFill;
            ctx.strokeStyle = colors.letterStroke;
            ctx.lineWidth = 1.8;

            const ox2 = (noise(seed + 3) - 0.5) * 1.5 * (0.35 + jitter * 0.65);
            const oy2 = (noise(seed + 4) - 0.5) * 1.5 * (0.35 + jitter * 0.65);

            ctx.fillText(this.char, ox2, oy2);
            ctx.strokeText(this.char, ox2, oy2);

            ctx.restore();
        }
    }

    // 背景古典测绘节点与连线
    class Node {
        constructor(x, y, isPrimary) {
            this.baseX = x;
            this.baseY = y;
            this.phase = Math.random() * Math.PI * 2;
            this.radius = isPrimary ? 3.5 : 2;
            this.isPrimary = isPrimary;
        }

        update(t) {
            this.x = this.baseX + Math.sin(this.phase + t * 0.5) * 12;
            this.y = this.baseY + Math.cos(this.phase + t * 0.4) * 12;
        }

        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.isPrimary ? colors.highlight : colors.ink;
            ctx.fill();

            if (this.isPrimary) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 2.8, 0, Math.PI * 2);
                ctx.strokeStyle = colors.inkLight;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }
    }

    class Edge {
        constructor(nodeA, nodeB) {
            this.a = nodeA;
            this.b = nodeB;
            this.cpOffset = (Math.random() - 0.5) * 80;
            this.drawProgress = Math.random();
        }

        draw(ctx) {
            const dx = this.b.x - this.a.x;
            const dy = this.b.y - this.a.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 350) return;

            const midX = (this.a.x + this.b.x) / 2;
            const midY = (this.a.y + this.b.y) / 2;
            const angle = Math.atan2(dy, dx);
            const cpX = midX + Math.cos(angle + Math.PI / 2) * this.cpOffset;
            const cpY = midY + Math.sin(angle + Math.PI / 2) * this.cpOffset;

            this.drawProgress -= 0.0015;

            ctx.beginPath();
            ctx.moveTo(this.a.x, this.a.y);
            ctx.quadraticCurveTo(cpX, cpY, this.b.x, this.b.y);

            ctx.setLineDash([3, 5]);
            ctx.lineDashOffset = this.drawProgress * 80;

            const alpha = Math.max(0, 1 - (this.a.x / (window.innerWidth || 1000)) * 1.3);
            ctx.strokeStyle = `rgba(${colors.edgeRgb}, ${0.35 * alpha})`;
            ctx.lineWidth = 0.7;

            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    // 初始化测绘图与节点
    function initGraph() {
        nodes = [];
        edges = [];

        const nodeCount = Math.floor((width * height) / 28000);
        for (let i = 0; i < nodeCount; i++) {
            const x = Math.random() * (width * 0.65); // 避开右侧档案卡
            const y = Math.random() * height;
            const isPrimary = Math.random() > 0.85;
            nodes.push(new Node(x, y, isPrimary));
        }

        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                const dx = nodes[i].baseX - nodes[j].baseX;
                const dy = nodes[i].baseY - nodes[j].baseY;
                if (dx * dx + dy * dy < 35000) {
                    if (Math.random() > 0.45) {
                        edges.push(new Edge(nodes[i], nodes[j]));
                    }
                }
            }
        }
    }

    // 布局两行手绘交互文字
    function layoutLetters() {
        letters = [];
        const line1 = "STORE";
        const line2 = "MANAGER";
        const fontSize = FONT_SIZE;

        ctx.font = `700 ${fontSize}px 'Cabin Sketch', 'Architects Daughter', cursive`;

        const isMobile = window.innerWidth <= 900;
        // 左方形区实际边长(与 CSS --login-square-* 一致, 不依赖硬编码)
        const leftAreaWidth = isMobile ? window.innerWidth : loginSquare();
        const centerX = leftAreaWidth / 2;
        const centerY = window.innerHeight / 2;
        const lineHeight = fontSize * 1.15;

        const lines = [line1, line2];
        const totalHeight = lineHeight * (lines.length - 1);
        const startY = centerY - totalHeight / 2;

        lines.forEach((text, lineIdx) => {
            let totalWidth = 0;
            const letterWidths = [];

            for (let i = 0; i < text.length; i++) {
                const w = ctx.measureText(text[i]).width;
                letterWidths.push(w);
                totalWidth += w;
            }

            let currentX = centerX - totalWidth / 2;
            const currentY = startY + lineIdx * lineHeight;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const w = letterWidths[i];
                const x = currentX + w / 2;

                letters.push(new Letter(char, x, currentY, fontSize));
                currentX += w;
            }
        });
    }

    // 绘制古典比例尺网格
    function drawGrid(ctx) {
        ctx.strokeStyle = colors.grid;
        ctx.lineWidth = 1;
        const gridSize = 100;

        ctx.beginPath();
        for (let x = 0; x < width; x += gridSize) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
        }
        for (let y = 0; y < height; y += gridSize) {
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
        }
        ctx.stroke();

        ctx.strokeStyle = colors.inkLight;
        ctx.lineWidth = 0.5;
        const marks = [
            { x: 40, y: 40 },
            { x: 40, y: height - 40 },
            { x: width * 0.55, y: 40 },
            { x: width * 0.55, y: height - 40 }
        ];

        marks.forEach(m => {
            ctx.beginPath();
            ctx.moveTo(m.x - 8, m.y); ctx.lineTo(m.x + 8, m.y);
            ctx.moveTo(m.x, m.y - 8); ctx.lineTo(m.x, m.y + 8);
            ctx.stroke();

            ctx.fillStyle = colors.inkLight;
            ctx.font = '9px "Space Mono", monospace';
            ctx.fillText(`+${m.x.toFixed(0)}`, m.x + 10, m.y + 3);
        });
    }

    function resize() {
        dpr = window.devicePixelRatio || 1;
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initGraph();
        layoutLetters();
    }

    // 渲染循环
    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        frame++;

        // 鼠标移动速度计算
        const mdx = mouse.x - mouse.px;
        const mdy = mouse.y - mouse.py;
        mouse.speed = Math.sqrt(mdx * mdx + mdy * mdy);
        mouse.px = mouse.x;
        mouse.py = mouse.y;

        // 不透明清屏: 消除半透明拖尾残影, 视觉干净且减少混合开销
        ctx.fillStyle = colors.clear;
        ctx.fillRect(0, 0, width, height);

        // 1. 绘制网格与底纹测绘节点
        drawGrid(ctx);
        edges.forEach(edge => edge.draw(ctx));
        nodes.forEach(node => {
            node.update(time);
            if (node.x < width * 0.7) {
                node.draw(ctx);
            }
        });

        // 2. 绘制手绘物理弹力文字
        for (let letter of letters) {
            letter.update(ELASTICITY);
            letter.draw();
        }
    }

    // ========== 自定义光标(占位 cursor/cursor.png, 加载后自动等比压缩到 32px) ==========
    // 你设计好 PNG 后直接替换 src/main/resources/static/cursor/cursor.png 即可, 无需改代码
    const CURSOR_PATH = 'cursor/cursor.png';
    const CURSOR_SIZE = 32;
    const cursorEl = document.getElementById('customCursor');
    let cursorReady = false;
    // 热点(有效点击点): 图片左上角第一个非透明像素
    let cursorHotX = 0;
    let cursorHotY = 0;

    (function loadCustomCursor() {
        const img = new Image();
        img.onload = () => {
            // 自动压缩: 长边压到 32px, 保持宽高比(任意分辨率原图都能用)
            const scale = CURSOR_SIZE / Math.max(img.width, img.height);
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            const cctx = c.getContext('2d', { willReadFrequently: true });
            cctx.drawImage(img, 0, 0, w, h);
            cursorEl.style.width = w + 'px';
            cursorEl.style.height = h + 'px';
            cursorEl.style.backgroundImage = `url(${c.toDataURL('image/png')})`;
            // 扫描左上角第一个非透明像素作为热点(alpha > 8 忽略抗锯齿边缘)
            try {
                const px = cctx.getImageData(0, 0, w, h).data;
                outer:
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        if (px[(y * w + x) * 4 + 3] > 8) {
                            cursorHotX = x;
                            cursorHotY = y;
                            break outer;
                        }
                    }
                }
            } catch (e) { /* 跨域等异常时保持默认热点 */ }
            cursorEl.classList.add('ready');
            cursorReady = true;
            // 触摸设备不启用自定义光标
            if (window.matchMedia('(hover: none)').matches) {
                cursorEl.classList.add('hidden');
            }
        };
        img.onerror = () => { /* 图片缺失: 静默退回系统光标 */ };
        img.src = CURSOR_PATH;
    })();

    // 光标跟随: 仅在左半画布区显示, 右半档案卡(表单)用系统光标
    function updateCursor(x, y) {
        if (!cursorReady) return;
        const cardRect = document.querySelector('.archive-card').getBoundingClientRect();
        const overCard = x >= cardRect.left;
        cursorEl.classList.toggle('hidden', overCard);
        if (!overCard) {
            // 热点对齐: 光标图片左上角第一个非透明像素对准鼠标位置
            cursorEl.style.transform =
                `translate3d(${x}px, ${y}px, 0) translate(${-cursorHotX}px, ${-cursorHotY}px)`;
        }
    }

    // 事件监听
    window.addEventListener('resize', resize);

    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        updateCursor(e.clientX, e.clientY);
    });

    window.addEventListener('mouseleave', () => {
        mouse.x = -9999;
        mouse.y = -9999;
        if (cursorReady) cursorEl.classList.add('hidden');
    });

    // Touch Support
    window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }
        if (cursorReady) cursorEl.classList.add('hidden');
    }, { passive: true });

    window.addEventListener('touchend', () => {
        mouse.x = -9999;
        mouse.y = -9999;
    });

    // ========== 主题切换: 单按钮轮询 亮色 -> 暗色 -> 跟随系统 ==========
    // 偏好存 localStorage['storemanager_theme'], 与主系统共用(一处切换两页同步)
    const THEME_CYCLE = ['light', 'dark', 'system'];
    const themeToggle = document.getElementById('themeToggle');

    function syncThemeToggle() {
        const pref = document.documentElement.dataset.themePref || 'system';
        themeToggle.dataset.pref = pref;
        themeToggle.title = pref === 'light' ? '主题: 亮色' : pref === 'dark' ? '主题: 暗色' : '主题: 跟随系统';
    }

    function applyTheme() {
        const pref = document.documentElement.dataset.themePref || 'system';
        const resolved = pref === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : pref;
        document.documentElement.dataset.theme = resolved;
        colors = THEMES[resolved];
        syncThemeToggle();
        // 立即重绘一帧, 画布换色无需等下一帧动画
        ctx.fillStyle = colors.clear;
        ctx.fillRect(0, 0, width, height);
    }

    themeToggle.addEventListener('click', () => {
        const cur = document.documentElement.dataset.themePref || 'system';
        const next = THEME_CYCLE[(THEME_CYCLE.indexOf(cur) + 1) % THEME_CYCLE.length];
        document.documentElement.dataset.themePref = next;
        localStorage.setItem('storemanager_theme', next);
        applyTheme();
    });

    // 跟随系统模式下, 系统主题变化时实时切换
    const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    themeMedia.addEventListener('change', () => {
        if (document.documentElement.dataset.themePref === 'system') applyTheme();
    });
    syncThemeToggle();

    // ========== 密码可见性切换(小眼睛) ==========
    const eyeToggle = document.getElementById('eyeToggle');
    const pwdInput = document.getElementById('password');
    eyeToggle.addEventListener('click', () => {
        const show = pwdInput.type === 'password';
        pwdInput.type = show ? 'text' : 'password';
        eyeToggle.classList.toggle('shown', show);
        eyeToggle.title = show ? '隐藏密码' : '显示密码';
        pwdInput.focus();
    });

    // ========== 记住我(仅记住账号, 本地存储) ==========
    const REMEMBER_KEY = 'storemanager_remember_user';
    const remember = document.getElementById('remember');
    const usernameInput = document.getElementById('username');
    try {
        const savedUser = localStorage.getItem(REMEMBER_KEY);
        if (savedUser) {
            usernameInput.value = savedUser;
            remember.checked = true;
        }
    } catch (e) { /* 隐私模式等异常静默处理 */ }

    // ========== 社交登录占位: 点击弹出"开发中", 2 秒后消失 ==========
    const toast = document.getElementById('toast');
    let toastTimer = null;
    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }
    document.querySelectorAll('.social-btn').forEach(btn => {
        btn.addEventListener('click', () => showToast('开发中'));
    });

    // 忘记密码 / 立即注册: 占位链接, 暂不跳转
    document.getElementById('forgotLink').addEventListener('click', (e) => e.preventDefault());
    document.getElementById('registerLink').addEventListener('click', (e) => e.preventDefault());

    // ========== 登录接入 ==========
    const loginForm = document.getElementById('loginForm');
    const errEl = document.getElementById('loginError');
    const submitBtn = document.getElementById('submitBtn');

    function showError(msg) {
        errEl.hidden = false;
        errEl.textContent = msg;
    }

    // 把后端/网络原始错误翻译成友好的短提示
    function friendlyLoginError(m) {
        const t = String(m || '').replace(/^系统异常[:：]?\s*/, '').split(/\r?\n/)[0].trim();
        if (t === '用户名不存在!' || t === '密码错误') return '账号或密码错误';
        if (/数据库|querying database|###/.test(t)) return '服务暂时不可用，请稍后再试';
        return t || '登录失败，请稍后再试';
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = usernameInput.value.trim();
        const password = pwdInput.value;
        if (!username || !password) { showError('请输入账号和密码'); return; }
        errEl.hidden = true;
        submitBtn.disabled = true;
        submitBtn.querySelector('span').textContent = '登 录中…';
        try {
            const r = await fetch('/user/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const j = await r.json();
            if (j.code !== 1) throw new Error(j.msg);
            // 记住我: 勾选则记住账号, 否则清除
            try {
                if (remember.checked) localStorage.setItem(REMEMBER_KEY, username);
                else localStorage.removeItem(REMEMBER_KEY);
            } catch (err) { /* 忽略存储异常 */ }
            localStorage.setItem('storemanager_token', j.data.token);
            localStorage.setItem('storemanager_user', JSON.stringify(j.data.user));
            location.href = '/';
        } catch (err) {
            showError(friendlyLoginError(err.message));
            submitBtn.disabled = false;
            submitBtn.querySelector('span').textContent = '登 录';
        }
    });

    // 确保字体加载完毕后平滑启动
    document.fonts.ready.then(() => {
        resize();
        animate();
    });
</script>
</body>
</html>
